name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Picks up documentation changes in the library.
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    # Stoic's DocC reference, built from the library's main branch. Needs Xcode
    # 27, the library's platform floor.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Vaccone-Software/stoic
      - run: sudo xcode-select -s /Applications/Xcode_27.0.app
      - name: Build
        run: |
          xcodebuild docbuild -scheme Stoic -destination 'platform=macOS' -derivedDataPath .build/docs -quiet
          xcrun docc process-archive transform-for-static-hosting .build/docs/Build/Products/Debug/Stoic.doccarchive \
            --output-path docs --hosting-base-path stoic-site/docs
          # The transform writes the renderer's empty theme over the catalog's.
          cp Sources/Stoic/Stoic.docc/theme-settings.json docs/
          # DocC names pages after symbols, colons included, which artifacts
          # refuse; a tarball carries them.
          tar -czf docs.tgz -C docs .
      - uses: actions/upload-artifact@v5
        with:
          name: docs
          path: docs.tgz

  build:
    needs: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # The pages for Adopting, Design and the contracts are Stoic's own
      # Markdown, read at build time. Checked out after lint so lint does not
      # walk it.
      - uses: actions/checkout@v5
        with:
          repository: Vaccone-Software/stoic
          path: stoic
      - name: Build
        # The project URL serves the site under /stoic-site. The token lifts
        # the GitHub API's rate limit for the changelog's release fetch.
        run: bun run build
        env:
          NEXT_PUBLIC_BASE_PATH: /stoic-site
          STOIC_DIR: stoic
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check links
        run: bun run links
        env:
          NEXT_PUBLIC_BASE_PATH: /stoic-site
      - uses: actions/download-artifact@v5
        with:
          name: docs
      - run: mkdir -p out/docs && tar -xzf docs.tgz -C out/docs
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: out

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
